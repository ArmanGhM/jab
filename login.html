<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پلتفرم - ساتراپ ویرا سازان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style/login.css" />
  </head>
  <body class="animated-bg">
    <!-- دایره‌های درخشان پس‌زمینه -->
    <div
      class="glow-circle"
      style="
        width: 400px;
        height: 400px;
        background: #0066ff;
        top: -100px;
        right: -100px;
      "
    ></div>
    <div
      class="glow-circle"
      style="
        width: 300px;
        height: 300px;
        background: #ffdd00;
        bottom: -50px;
        left: -50px;
      "
    ></div>
    <div
      class="glow-circle"
      style="
        width: 250px;
        height: 250px;
        background: #00d4ff;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      "
    ></div>

    <div
      class="relative z-10 min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 sm:py-12"
    >
      <div class="w-full max-w-[95%] sm:max-w-md md:max-w-lg">
        <div class="glass-card rounded-2xl sm:rounded-3xl p-6 sm:p-8 lg:p-12">
          <!-- لوگو و عنوان -->
          <div class="text-center mb-8 sm:mb-10">
            <div
              class="logo-icon w-20 h-20 sm:w-24 sm:h-24 rounded-2xl sm:rounded-3xl mx-auto mb-4 sm:mb-6 flex items-center justify-center"
            >
              <svg
                class="w-10 h-10 sm:w-12 sm:h-12 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
            <h2
              class="text-2xl sm:text-3xl font-black text-white mb-2 drop-shadow-lg"
            >
              ورود به پلتفرم
            </h2>
            <p class="text-sm sm:text-base text-blue-200">
              اطلاعات خود را وارد کنید
            </p>
          </div>

          <!-- فرم -->
          <form
            class="space-y-5 sm:space-y-6"
            onsubmit="event.preventDefault(); alert('فرم ورود ارسال شد!');"
          >
            <!-- نام کاربری -->
            <div>
              <label
                class="block text-white font-semibold mb-2 sm:mb-3 text-xs sm:text-sm"
              >
                نام کاربری یا ایمیل
              </label>
              <div class="relative">
                <input
                  type="text"
                  class="premium-input w-full px-4 sm:px-5 py-3 sm:py-4 pr-11 sm:pr-12 rounded-xl outline-none text-white placeholder:text-gray-300 text-sm sm:text-base"
                  placeholder="username@example.com"
                  required
                />
                <div
                  class="absolute right-3 sm:right-4 top-1/2 transform -translate-y-1/2 text-blue-400 pointer-events-none"
                >
                  <svg
                    class="w-4 h-4 sm:w-5 sm:h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>

            <!-- رمز عبور -->
            <div>
              <label
                class="block text-white font-semibold mb-2 sm:mb-3 text-xs sm:text-sm"
              >
                رمز عبور
              </label>
              <div class="relative">
                <input
                  type="password"
                  class="premium-input w-full px-4 sm:px-5 py-3 sm:py-4 pr-11 sm:pr-12 rounded-xl outline-none text-white placeholder:text-gray-300 text-sm sm:text-base"
                  placeholder="••••••••••"
                  required
                />
                <div
                  class="absolute right-3 sm:right-4 top-1/2 transform -translate-y-1/2 text-yellow-400 pointer-events-none"
                >
                  <svg
                    class="w-4 h-4 sm:w-5 sm:h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>

            <!-- به خاطر سپاری و فراموشی رمز -->
            <div
              class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-0 text-xs sm:text-sm"
            >
              <label
                class="flex items-center cursor-pointer text-white hover:text-blue-300 transition"
              >
                <input type="checkbox" class="custom-checkbox ml-2" />
                <span>مرا به خاطر بسپار</span>
              </label>
              <a href="#" class="premium-link font-semibold">
                فراموشی رمز عبور؟
              </a>
            </div>

            <!-- دکمه ورود -->
            <button
              type="submit"
              class="gradient-button w-full py-3 sm:py-4 rounded-xl text-white font-bold text-base sm:text-lg transform hover:scale-105 transition-all duration-300"
            >
              <span class="flex items-center justify-center gap-2">
                <span>ورود به پلتفرم</span>
                <svg
                  class="w-4 h-4 sm:w-5 sm:h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 7l5 5m0 0l-5 5m5-5H6"
                  ></path>
                </svg>
              </span>
            </button>

            <!-- دکمه‌های ثانویه -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
              <a
                href="#"
                class="outline-button-blue text-white border-white py-3 rounded-xl text-center font-bold flex items-center justify-center gap-2 text-xs sm:text-sm"
              >
                <svg
                  class="w-3 h-3 sm:w-4 sm:h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                بیشتر بدانید
              </a>
              <a
                href="#"
                class="outline-button-yellow py-3 rounded-xl text-center font-bold flex items-center justify-center gap-2 text-xs sm:text-sm"
              >
                <svg
                  class="w-3 h-3 sm:w-4 sm:h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                درخواست دمو
              </a>
            </div>
          </form>

          <!-- پشتیبانی -->
          <div class="text-center mt-6 sm:mt-8 space-y-3">
            <p class="text-white/70 text-xs sm:text-sm">نیاز به کمک دارید؟</p>
            <div
              class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 text-xs sm:text-sm"
            >
              <a
                href="#"
                class="text-blue-300 hover:text-blue-200 transition flex items-center gap-1"
              >
                <svg
                  class="w-3 h-3 sm:w-4 sm:h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  ></path>
                </svg>
                ایمیل
              </a>
              <a
                href="#"
                class="text-yellow-300 hover:text-yellow-200 transition flex items-center gap-1"
              >
                <svg
                  class="w-3 h-3 sm:w-4 sm:h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                  ></path>
                </svg>
                تماس
              </a>
              <a
                href="#"
                class="text-blue-300 hover:text-blue-200 transition flex items-center gap-1"
              >
                <svg
                  class="w-3 h-3 sm:w-4 sm:h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                راهنما
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
