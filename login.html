<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پلتفرم - ساتراپ ویرا سازان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style/login.css" />
  </head>
  <body>
    <!-- دکمه تغییر تم -->
    <div class="theme-toggle" onclick="toggleTheme()">
      <svg
        id="sun-icon"
        class="w-6 h-6 text-yellow-500"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
          clip-rule="evenodd"
        ></path>
      </svg>
      <svg
        id="moon-icon"
        class="w-6 h-6 text-blue-600 hidden"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
        ></path>
      </svg>
    </div>

    <div class="flex items-center justify-center min-h-screen p-4 sm:p-6">
      <div class="w-full max-w-md">
        <div class="login-card rounded-2xl sm:rounded-3xl p-6 sm:p-8 lg:p-10">
          <!-- لوگو و عنوان -->
          <div class="text-center mb-6 sm:mb-8">
            <div
              class="logo-box w-16 h-16 sm:w-20 sm:h-20 rounded-2xl mx-auto mb-4 sm:mb-5 flex items-center justify-center"
            >
              <svg
                class="w-8 h-8 sm:w-10 sm:h-10 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-main mb-2">
              ورود به پلتفرم
            </h1>
            <p class="text-sm sm:text-base text-secondary">
              لطفا اطلاعات خود را وارد کنید
            </p>
          </div>

          <!-- فرم -->
          <form
            class="space-y-4 sm:space-y-5"
            onsubmit="event.preventDefault(); alert('ورود موفقیت‌آمیز!');"
          >
            <!-- نام کاربری -->
            <div>
              <label class="block text-sm font-semibold text-main mb-2">
                نام کاربری یا ایمیل
              </label>
              <input
                type="text"
                class="input-field w-full px-4 py-3 rounded-xl outline-none"
                placeholder="username@example.com"
                required
              />
            </div>

            <!-- رمز عبور -->
            <div>
              <label class="block text-sm font-semibold text-main mb-2">
                رمز عبور
              </label>
              <input
                type="password"
                class="input-field w-full px-4 py-3 rounded-xl outline-none"
                placeholder="••••••••"
                required
              />
            </div>

            <!-- به خاطر سپاری و فراموشی -->
            <div
              class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 sm:gap-0 text-sm"
            >
              <label class="flex items-center cursor-pointer text-main">
                <input type="checkbox" class="custom-checkbox ml-2" />
                <span>مرا به خاطر بسپار</span>
              </label>
              <a href="#" class="link"> فراموشی رمز عبور </a>
            </div>

            <!-- دکمه ورود -->
            <button
              type="submit"
              class="btn-primary w-full py-3 sm:py-3.5 rounded-xl text-base sm:text-lg"
            >
              ورود به پلتفرم
            </button>

            <!-- خط جداکننده -->
            <div class="relative my-5 sm:my-6">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t divider"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="px-4 divider-bg text-secondary">یا</span>
              </div>
            </div>

            <!-- دکمه‌های ثانویه -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <a
                href="#"
                class="btn-outline px-4 py-3 rounded-xl text-center text-sm sm:text-base"
              >
                اطلاعات بیشتر
              </a>
              <a
                href="#"
                class="btn-outline px-4 py-3 rounded-xl text-center text-sm sm:text-base"
              >
                درخواست دمو
              </a>
            </div>
          </form>

          <!-- پشتیبانی -->
          <div class="text-center mt-6 sm:mt-8 pt-5 sm:pt-6 border-t divider">
            <p class="text-xs sm:text-sm text-secondary mb-3">
              نیاز به کمک دارید؟
            </p>
            <div
              class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 text-xs sm:text-sm"
            >
              <a href="#" class="link"> 📧 ایمیل </a>
              <a href="#" class="link"> 📞 تماس </a>
              <a href="#" class="link"> ❓ راهنما </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // تنظیم تم اولیه
      const body = document.body;
      const sunIcon = document.getElementById("sun-icon");
      const moonIcon = document.getElementById("moon-icon");

      // بررسی تم ذخیره شده
      const savedTheme = localStorage.getItem("theme") || "light";
      if (savedTheme === "dark") {
        body.classList.add("dark");
        sunIcon.classList.add("hidden");
        moonIcon.classList.remove("hidden");
      }

      // تابع تغییر تم
      function toggleTheme() {
        body.classList.toggle("dark");

        if (body.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
          sunIcon.classList.add("hidden");
          moonIcon.classList.remove("hidden");
        } else {
          localStorage.setItem("theme", "light");
          sunIcon.classList.remove("hidden");
          moonIcon.classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
