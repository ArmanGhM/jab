<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پلتفرم - ساتراپ ویرا سازان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Vazirmatn", sans-serif;
      }

      /* پس‌زمینه متحرک با گرادیانت */
      .animated-bg {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(120deg, #0a1628, #1e3a5f, #2d5a8c, #0066ff);
        background-size: 400% 400%;
        animation: moveBg 15s ease infinite;
        position: relative;
        overflow: hidden;
      }

      @keyframes moveBg {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      /* ذرات شناور در پس‌زمینه */
      .animated-bg::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background-image: radial-gradient(
            2px 2px at 20% 30%,
            rgba(255, 255, 255, 0.3),
            transparent
          ),
          radial-gradient(
            2px 2px at 60% 70%,
            rgba(255, 221, 0, 0.3),
            transparent
          ),
          radial-gradient(
            1px 1px at 50% 50%,
            rgba(0, 102, 255, 0.3),
            transparent
          ),
          radial-gradient(
            2px 2px at 80% 10%,
            rgba(255, 255, 255, 0.3),
            transparent
          );
        background-size: 200px 200px, 300px 300px, 250px 250px, 350px 350px;
        animation: float 20s linear infinite;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(-50%, -50%);
        }
      }

      /* دایره‌های درخشان */
      .glow-circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.3;
        animation: pulse 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.3;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.5;
        }
      }

      /* کارت شیشه‌ای پیشرفته */
      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          0 0 60px rgba(0, 102, 255, 0.2);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 0 80px rgba(0, 102, 255, 0.3);
      }

      .dark .glass-card {
        background: rgba(16, 25, 34, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* لوگو متحرک */
      .logo-icon {
        background: linear-gradient(
          135deg,
          #0066ff 0%,
          #00d4ff 50%,
          #ffdd00 100%
        );
        box-shadow: 0 10px 30px rgba(0, 102, 255, 0.5),
          0 0 50px rgba(0, 212, 255, 0.3);
        animation: logoFloat 3s ease-in-out infinite,
          logoGlow 2s ease-in-out infinite;
        position: relative;
      }

      .logo-icon::before {
        content: "";
        position: absolute;
        inset: -3px;
        background: linear-gradient(135deg, #0066ff, #00d4ff, #ffdd00);
        border-radius: inherit;
        z-index: -1;
        filter: blur(10px);
        opacity: 0.7;
        animation: rotate 4s linear infinite;
      }

      @keyframes logoFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(5deg);
        }
      }

      @keyframes logoGlow {
        0%,
        100% {
          box-shadow: 0 10px 30px rgba(0, 102, 255, 0.5),
            0 0 50px rgba(0, 212, 255, 0.3);
        }
        50% {
          box-shadow: 0 15px 40px rgba(0, 102, 255, 0.7),
            0 0 70px rgba(255, 221, 0, 0.5);
        }
      }

      @keyframes rotate {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* فیلدهای ورودی پریمیوم */
      .premium-input {
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .premium-input:focus {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(0, 102, 255, 0.6);
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .dark .premium-input {
        background: rgba(255, 255, 255, 0.05);
        color: white;
      }

      .dark .premium-input:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(0, 212, 255, 0.6);
      }

      /* دکمه گرادیانت متحرک */
      .gradient-button {
        background: linear-gradient(135deg, #0066ff, #00d4ff, #0066ff);
        background-size: 200% 200%;
        animation: gradientShift 3s ease infinite;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 102, 255, 0.4);
      }

      .gradient-button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transform: translateX(-100%);
        transition: transform 0.6s;
      }

      .gradient-button:hover::before {
        transform: translateX(100%);
      }

      .gradient-button:hover {
        box-shadow: 0 15px 40px rgba(0, 102, 255, 0.6),
          0 0 60px rgba(0, 212, 255, 0.4);
      }

      @keyframes gradientShift {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }

      /* چک‌باکس سفارشی */
      .custom-checkbox {
        appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(0, 102, 255, 0.5);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.05);
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
      }

      .custom-checkbox:checked {
        background: linear-gradient(135deg, #0066ff, #00d4ff);
        border-color: #0066ff;
      }

      .custom-checkbox:checked::after {
        content: "✓";
        position: absolute;
        color: white;
        font-size: 14px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      /* دکمه‌های outline */
      .outline-button-blue {
        border: 2px solid rgba(0, 102, 255, 0.5);
        color: #ffffff;
        background: rgba(0, 102, 255, 0.05);
        transition: all 0.3s;
      }

      .outline-button-blue:hover {
        background: rgba(0, 102, 255, 0.15);
        border-color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(0, 102, 255, 0.3);
      }

      .dark .outline-button-blue {
        color: #ffffff;
        border-color: rgba(0, 212, 255, 0.5);
      }

      .outline-button-yellow {
        border: 2px solid rgba(255, 221, 0, 0.5);
        color: #d4a500;
        background: rgba(255, 221, 0, 0.05);
        transition: all 0.3s;
      }

      .outline-button-yellow:hover {
        background: rgba(255, 221, 0, 0.15);
        border-color: #ffdd00;
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(255, 221, 0, 0.3);
      }

      .dark .outline-button-yellow {
        color: #ffdd00;
      }

      /* لینک‌های پریمیوم */
      .premium-link {
        color: #00d4ff;
        position: relative;
        transition: all 0.3s;
      }

      .premium-link::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #0066ff, #00d4ff);
        transition: width 0.3s;
      }

      .premium-link:hover::after {
        width: 100%;
      }

      .premium-link:hover {
        color: #0066ff;
        text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
      }

      /* انیمیشن ورود عناصر */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .glass-card > * {
        animation: fadeInUp 0.6s ease-out backwards;
      }

      .glass-card > *:nth-child(1) {
        animation-delay: 0.1s;
      }
      .glass-card > *:nth-child(2) {
        animation-delay: 0.2s;
      }
      .glass-card > *:nth-child(3) {
        animation-delay: 0.3s;
      }
      .glass-card > *:nth-child(4) {
        animation-delay: 0.4s;
      }

      /* اسکرول‌بار سفارشی */
      ::-webkit-scrollbar {
        width: 10px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #0066ff, #00d4ff);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #00d4ff, #0066ff);
      }
    </style>
  </head>
  <body class="animated-bg">
    <!-- دایره‌های درخشان پس‌زمینه -->
    <div
      class="glow-circle"
      style="
        width: 400px;
        height: 400px;
        background: #0066ff;
        top: -100px;
        right: -100px;
      "
    ></div>
    <div
      class="glow-circle"
      style="
        width: 300px;
        height: 300px;
        background: #ffdd00;
        bottom: -50px;
        left: -50px;
      "
    ></div>
    <div
      class="glow-circle"
      style="
        width: 250px;
        height: 250px;
        background: #00d4ff;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      "
    ></div>

    <div
      class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12"
    >
      <div class="w-full max-w-lg">
        <div class="glass-card rounded-3xl p-8 lg:p-12">
          <!-- لوگو و عنوان -->
          <div class="text-center mb-10">
            <div
              class="logo-icon w-24 h-24 rounded-3xl mx-auto mb-6 flex items-center justify-center"
            >
              <svg
                class="w-12 h-12 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                ></path>
              </svg>
            </div>
            <h2 class="text-3xl font-black text-white mb-2 drop-shadow-lg">
              ورود به پلتفرم
            </h2>
            <p class="text-blue-200">اطلاعات خود را وارد کنید</p>
          </div>

          <!-- فرم -->
          <form
            class="space-y-6"
            onsubmit="event.preventDefault(); alert('فرم ورود ارسال شد!');"
          >
            <!-- نام کاربری -->
            <div>
              <label class="block text-white font-semibold mb-3 text-sm">
                نام کاربری یا ایمیل
              </label>
              <div class="relative">
                <input
                  type="text"
                  class="premium-input w-full px-5 py-4 pr-12 rounded-xl outline-none text-white placeholder:text-gray-300"
                  placeholder="username@example.com"
                  required
                />
                <div
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 text-blue-400 pointer-events-none"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>

            <!-- رمز عبور -->
            <div>
              <label class="block text-white font-semibold mb-3 text-sm">
                رمز عبور
              </label>
              <div class="relative">
                <input
                  type="password"
                  class="premium-input w-full px-5 py-4 pr-12 rounded-xl outline-none text-white placeholder:text-gray-300"
                  placeholder="••••••••••"
                  required
                />
                <div
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 text-yellow-400 pointer-events-none"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>

            <!-- به خاطر سپاری و فراموشی رمز -->
            <div class="flex items-center justify-between text-sm">
              <label
                class="flex items-center cursor-pointer text-white hover:text-blue-300 transition"
              >
                <input type="checkbox" class="custom-checkbox ml-2" />
                <span>مرا به خاطر بسپار</span>
              </label>
              <a href="#" class="premium-link font-semibold">
                فراموشی رمز عبور؟
              </a>
            </div>

            <!-- دکمه ورود -->
            <button
              type="submit"
              class="gradient-button w-full py-4 rounded-xl text-white font-bold text-lg transform hover:scale-105 transition-all duration-300"
            >
              <span class="flex items-center justify-center gap-2">
                <span>ورود به پلتفرم</span>
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 7l5 5m0 0l-5 5m5-5H6"
                  ></path>
                </svg>
              </span>
            </button>

            <!-- دکمه‌های ثانویه -->
            <div class="grid grid-cols-2 gap-4">
              <a
                href="#"
                class="outline-button-blue py-3 rounded-xl text-center font-bold flex items-center justify-center gap-2 text-sm"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                بیشتر بدانید
              </a>
              <a
                href="#"
                class="outline-button-yellow py-3 rounded-xl text-center font-bold flex items-center justify-center gap-2 text-sm"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
                  ></path>
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                درخواست دمو
              </a>
            </div>
          </form>

          <!-- پشتیبانی -->
          <div class="text-center mt-8 space-y-3">
            <p class="text-white/70 text-sm">نیاز به کمک دارید؟</p>
            <div class="flex items-center justify-center gap-6 text-sm">
              <a
                href="#"
                class="text-blue-300 hover:text-blue-200 transition flex items-center gap-1"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  ></path>
                </svg>
                ایمیل
              </a>
              <a
                href="#"
                class="text-yellow-300 hover:text-yellow-200 transition flex items-center gap-1"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                  ></path>
                </svg>
                تماس
              </a>
              <a
                href="#"
                class="text-blue-300 hover:text-blue-200 transition flex items-center gap-1"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                راهنما
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
